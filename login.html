<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — JYYR STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="login-brand">
      <h1>JYYR STORE</h1>
      <p id="loginSubtitle">LOGIN UNTUK MELANJUTKAN</p>
    </div>
    <form id="authForm" autocomplete="on">
      <div id="nameWrap" class="hidden"><input class="input" id="regName" placeholder="Nama lengkap" type="text" autocomplete="name"></div>
      <input class="input hidden" id="regEmail" placeholder="Email" type="email" autocomplete="email">
      <input class="input" id="authUsername" placeholder="Email atau Username" type="text" autocomplete="username" required>
      <input class="input" id="authPassword" placeholder="Password" type="password" autocomplete="current-password" required>
      <div id="authError" class="login-error"></div>
      <button class="login-submit" id="authSubmit" type="submit">Masuk</button>
      <button class="login-switch" id="authSwitch" type="button">Belum punya akun? Daftar</button>
    </form>
    <div class="login-hint">Akses toko hanya tersedia setelah login.</div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  const { createClient } = window.supabase;
  const client = createClient(window.JYYR_SUPABASE_URL, window.JYYR_SUPABASE_PUBLISHABLE_KEY);
  let mode = new URLSearchParams(location.search).get('mode') === 'register' ? 'register' : 'login';

  const form=document.getElementById('authForm');
  const nameWrap=document.getElementById('nameWrap');
  const name=document.getElementById('regName');
  const regEmail=document.getElementById('regEmail');
  const user=document.getElementById('authUsername');
  const pass=document.getElementById('authPassword');
  const submit=document.getElementById('authSubmit');
  const sw=document.getElementById('authSwitch');
  const sub=document.getElementById('loginSubtitle');
  const err=document.getElementById('authError');

  function sync(){
    const reg=mode==='register';
    nameWrap.classList.toggle('hidden',!reg);
    regEmail.classList.toggle('hidden',!reg);
    name.required=reg;
    regEmail.required=reg;
    user.required=true;
    user.placeholder=reg?'Username (tanpa @)':'Email atau Username';
    submit.textContent=reg?'Buat Akun':'Masuk';
    sw.textContent=reg?'Sudah punya akun? Login':'Belum punya akun? Daftar';
    sub.textContent=reg?'BUAT AKUN JYYR STORE':'LOGIN UNTUK MELANJUTKAN';
    pass.autocomplete=reg?'new-password':'current-password';
    err.textContent='';
  }

  sw.onclick=()=>{ mode=mode==='login'?'register':'login'; sync(); };

  form.onsubmit=async e=>{
    e.preventDefault();
    err.textContent='';
    submit.disabled=true;
    submit.textContent=mode==='register'?'Membuat akun...':'Memproses...';

    try{
      const username=user.value.trim().toLowerCase();
      const password=pass.value;

      if(password.length<6) throw new Error('Password minimal 6 karakter.');

      if(mode==='register'){
        // Username memang HARUS username, bukan email.
        if(!/^[a-z0-9_.-]+$/.test(username)) {
          throw new Error('Username hanya boleh berisi huruf, angka, titik, garis bawah, atau tanda hubung. Jangan gunakan @.');
        }
        if(username.length<3) throw new Error('Username minimal 3 karakter.');

        const email=regEmail.value.trim().toLowerCase();
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
          throw new Error('Masukkan email yang valid, misalnya nama@gmail.com.');
        }

        const {data:existing,error:profileCheckError}=await client
          .from('profiles')
          .select('id')
          .eq('username',username)
          .maybeSingle();
        if(profileCheckError) throw profileCheckError;
        if(existing) throw new Error('Username sudah digunakan.');

        const {data,error}=await client.auth.signUp({
          email,
          password,
          options:{
            data:{
              username,
              full_name:name.value.trim() || username
            }
          }
        });
        if(error) throw error;

        // Jika email confirmation aktif, Supabase tidak memberi session langsung.
        // Akun/profile tetap dibuat oleh trigger database.
        if(!data.session){
          err.textContent='Akun berhasil dibuat. Silakan cek email untuk konfirmasi sebelum login.';
          submit.disabled=false;
          submit.textContent='Buat Akun';
          return;
        }

        location.replace('index.html');
      }else{
        // Login menerima email langsung atau username.
        let email=username;
        if(!username.includes('@')){
          const {data:profile,error:profileError}=await client
            .from('profiles')
            .select('id')
            .eq('username',username)
            .maybeSingle();
          if(profileError) throw profileError;
          if(!profile) throw new Error('Username tidak ditemukan.');

          const {data:authUser,error:authError}=await client
            .from('profiles')
            .select('id')
            .eq('id',profile.id)
            .maybeSingle();
          if(authError) throw authError;
          // Supabase Auth signInWithPassword memerlukan email.
          // Ambil email dari auth.users melalui RPC/view jika tersedia; fallback ke pola lama hanya untuk kompatibilitas.
          const {data:emailRow,error:emailError}=await client.rpc('get_auth_email_by_profile_id',{profile_id:profile.id});
          if(!emailError && emailRow){
            email=Array.isArray(emailRow)?emailRow[0]?.email:emailRow.email;
          }else{
            // Username lama @jyyr.store tetap dicoba sebagai fallback.
            email=`${username}@jyyr.store`;
          }
        }

        const {error}=await client.auth.signInWithPassword({email:email.toLowerCase(),password});
        if(error) throw error;
        location.replace('index.html');
      }
    }catch(e){
      err.textContent=e?.message||'Terjadi kesalahan.';
    }finally{
      submit.disabled=false;
      submit.textContent=mode==='register'?'Buat Akun':'Masuk';
    }
  };

  client.auth.getSession().then(({data})=>{if(data.session) location.replace('index.html');});
  sync();
})();
</script>
</body>
</html>
