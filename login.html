<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="jyyr-version" content="4.9.4">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — JYYR STORE</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/features.css">
<link rel="manifest" href="manifest.json">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="login-brand">
      <h1>JYYR STORE</h1>
      <p id="loginSubtitle">LOGIN UNTUK MELANJUTKAN</p>
    </div>
    <form id="authForm" autocomplete="on">
      <div id="nameWrap" class="hidden"><input class="input" id="regName" placeholder="Nama lengkap" type="text" autocomplete="name"></div>
      <input class="input hidden" id="regEmail" placeholder="Email" type="email" autocomplete="email">
      <input class="input" id="authUsername" placeholder="Email atau Username" type="text" autocomplete="username" required>
      <div class="password-field">
        <input class="input" id="authPassword" placeholder="Password" type="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Tampilkan password" aria-pressed="false" title="Tampilkan password">
          <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/>
            <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/>
          </svg>
          <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/>
            <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"/>
            <path d="M3 3l18 18"/>
          </svg>
        </button>
      </div>
      <div id="authError" class="login-error"></div>
      <button class="login-submit" id="authSubmit" type="submit">Masuk</button>
      <button class="login-switch" id="authSwitch" type="button">Belum punya akun? Daftar</button><button class="login-switch" id="forgotBtn" type="button">Lupa password?</button>
    </form>
    <div class="login-hint">Akses toko hanya tersedia setelah login.</div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/login.js"></script>
<script src="js/load.js"></script>
</body>
</html>
