<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="jyyr-version" content="4.9.4">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JYYR ADMIN PANEL</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/features.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/popup.css">
<link rel="manifest" href="manifest.json">
</head>
<body class="admin-page">
  <div class="future-bg" aria-hidden="true"><div class="blue-fog"></div><div id="particles"></div></div>
  <div class="admin-page-shell">
    <header class="admin-page-head">
      <div class="admin-page-title">
        <h1><span class="ui-icon-wrap"><span data-icon="user"></span></span> ADMIN PANEL</h1>
        <p id="adminPageWelcome">Memuat akun admin...</p>
      </div>
      <div class="admin-page-actions" aria-label="Navigasi admin">
        <button type="button" onclick="location.href='index.html'"><span class="ui-icon-wrap"><span data-icon="home"></span></span> Store</button>
        <button type="button" class="admin-back" onclick="logoutUser()"><span class="ui-icon-wrap"><span data-icon="logout"></span></span> Log Out</button>
      </div>
    </header>

    <main class="admin-page-main">
      <div class="admin-head">
        <div><h3><span class="ui-icon-wrap"><span data-icon="shield"></span></span> JYYR ADMIN PANEL</h3><small id="adminWelcome"></small></div>
      </div>
      <nav class="admin-tabs" aria-label="Menu administrasi">
        <button type="button" role="tab" onclick="adminTab('overview')" class="admin-tab" data-admin-tab="overview" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="chart"></span></span> Statistik</button>
        <button type="button" role="tab" onclick="adminTab('products')" class="admin-tab" data-admin-tab="products" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="package"></span></span> Produk</button>
        <button type="button" role="tab" onclick="adminTab('users')" class="admin-tab" data-admin-tab="users" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="users"></span></span> User</button>
        <button type="button" role="tab" onclick="adminTab('orders')" class="admin-tab" data-admin-tab="orders" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="receipt"></span></span> Transaksi</button>
        <button type="button" role="tab" onclick="adminTab('payments')" class="admin-tab" data-admin-tab="payments" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="card"></span></span> Pembayaran</button>
        <button type="button" role="tab" onclick="adminTab('levels')" class="admin-tab" data-admin-tab="levels" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="trophy"></span></span> Level</button>
        <button type="button" role="tab" onclick="adminTab('broadcast')" class="admin-tab" data-admin-tab="broadcast" aria-selected="false" tabindex="-1"><span class="ui-icon-wrap"><span data-icon="broadcast"></span></span> Broadcast</button>
      </nav>
      <div id="adminContent"></div>
    </main>
  </div>

  <div class="popup" id="popupSuccess"><div class="popup-box"><h3><span class="ui-icon-wrap"><span data-icon="check"></span></span> Berhasil</h3><p id="successText">Berhasil.</p><button class="btn-close" onclick="closeSuccess()"><span data-icon="close"></span></button></div></div>
  <div class="popup" id="popupError"><div class="popup-box"><h3><span class="ui-icon-wrap"><span data-icon="alert"></span></span> Peringatan</h3><p id="popupText">Terjadi kesalahan.</p><button onclick="closePopup()">Oke</button></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/jyyr-features.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const allowedTabs=['overview','products','users','orders','payments','levels','broadcast','notifications','reports','security','system','support'];
      let tries=0;
      const boot=()=>{
        const u=window.currentAccount?.();
        if(!u){
          if(++tries<100) return setTimeout(boot,100);
          return;
        }
        const role=window.jyyrRoleLabel?.(u)||'user';
        if(!['owner','admin','readonly'].includes(role)){
          location.replace('index.html'); return;
        }
        const text='Login sebagai '+u.username+' • '+role;
        document.getElementById('adminPageWelcome').textContent=text;
        document.getElementById('adminWelcome').textContent=text;
        const requested=new URLSearchParams(location.search).get('tab');
        const tab=allowedTabs.includes(requested)?requested:'overview';
        if(typeof window.adminTab==='function') window.adminTab(tab);
      };
      boot();
    });
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>

<script>document.addEventListener('DOMContentLoaded',()=>{if(!window.jyyrIcon)return;document.querySelectorAll('[data-icon]').forEach(n=>{const name=n.dataset.icon;const holder=document.createElement('span');holder.innerHTML=window.jyyrIcon(name);const el=holder.firstElementChild;if(el)n.replaceWith(el);});});</script>
</body>
</html>
